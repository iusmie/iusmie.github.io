<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="时间戳转换工具" />
    <title>时间戳转换 | Timestamp Converter</title>
    <link rel="stylesheet" href="../../assets/css/common.css" />
    <style>
      .timestamp-converter {
        max-width: 100%;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="/index.html" class="back-home">← 返回首页</a>

      <div class="header">
        <h1 class="name">⏰ 时间戳转换</h1>
        <p class="title">Timestamp Converter</p>
      </div>

      <div class="section">
        <div class="timestamp-converter">
          <!-- Unix 时间戳转日期时间 -->
          <div class="converter-section">
            <h3>Unix 时间戳 → 日期时间</h3>
            <div class="unit-toggle">
              <button class="unit-btn active" data-unit="seconds">秒 (s)</button>
              <button class="unit-btn" data-unit="milliseconds">毫秒 (ms)</button>
            </div>
            <div class="input-group">
              <label>输入时间戳</label>
              <input type="text" id="timestampInput" placeholder="例如: 1704067200" />
            </div>
            <div class="input-group">
              <label>时区</label>
              <select id="timezoneSelect">
                <option value="local">本地时区 (Local)</option>
                <option value="UTC" selected>UTC</option>
                <option value="Asia/Shanghai">Asia/Shanghai (UTC+8)</option>
                <option value="America/New_York">America/New_York (UTC-5)</option>
                <option value="America/Los_Angeles">America/Los_Angeles (UTC-8)</option>
                <option value="Europe/London">Europe/London (UTC+0)</option>
                <option value="Asia/Tokyo">Asia/Tokyo (UTC+9)</option>
              </select>
            </div>
            <div class="result-box empty" id="timestampResult">请输入时间戳...</div>
            <button class="copy-btn" onclick="copyResult('timestampResult')">复制结果</button>
          </div>

          <!-- 日期时间转 Unix 时间戳 -->
          <div class="converter-section">
            <h3>日期时间 → Unix 时间戳</h3>
            <div class="input-group">
              <label>日期</label>
              <input type="date" id="dateInput" />
            </div>
            <div class="input-row">
              <div class="input-group">
                <label>时</label>
                <input type="number" id="hourInput" min="0" max="23" value="0" />
              </div>
              <div class="input-group">
                <label>分</label>
                <input type="number" id="minuteInput" min="0" max="59" value="0" />
              </div>
              <div class="input-group">
                <label>秒</label>
                <input type="number" id="secondInput" min="0" max="59" value="0" />
              </div>
            </div>
            <div class="input-group">
              <label>时区</label>
              <select id="datetimeTimezoneSelect">
                <option value="local" selected>本地时区 (Local)</option>
                <option value="UTC">UTC</option>
                <option value="Asia/Shanghai">Asia/Shanghai (UTC+8)</option>
                <option value="America/New_York">America/New_York (UTC-5)</option>
                <option value="America/Los_Angeles">America/Los_Angeles (UTC-8)</option>
                <option value="Europe/London">Europe/London (UTC+0)</option>
                <option value="Asia/Tokyo">Asia/Tokyo (UTC+9)</option>
              </select>
            </div>
            <div class="unit-toggle">
              <button class="unit-btn active" data-output-unit="seconds">输出秒 (s)</button>
              <button class="unit-btn" data-output-unit="milliseconds">输出毫秒 (ms)</button>
            </div>
            <div class="result-box empty" id="datetimeResult">请选择日期时间...</div>
            <button class="copy-btn" onclick="copyResult('datetimeResult')">复制结果</button>
          </div>

          <!-- 当前时间 -->
          <div class="converter-section">
            <h3>当前时间</h3>
            <div class="result-box" id="currentTime"></div>
            <div style="margin-top: 10px;">
              <div class="result-box" id="currentTimestamp" style="margin-top: 0;"></div>
            </div>
            <div style="margin-top: 10px;">
              <div class="result-box" id="currentTimezone" style="margin-top: 0;"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="footer">
        <p>Made with ❤️ | © 2025 Personal Website</p>
      </div>
    </div>

    <script>
      let currentUnit = 'seconds';
      let currentOutputUnit = 'seconds';

      // 获取时区偏移量字符串
      function getTimezoneOffset(date, timezone) {
        if (timezone === 'local') {
          const offset = -date.getTimezoneOffset();
          const sign = offset >= 0 ? '+' : '-';
          const hours = Math.floor(Math.abs(offset) / 60);
          const minutes = Math.abs(offset) % 60;
          return `UTC${sign}${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }
        
        // 使用 Intl API 获取时区信息
        try {
          const formatter = new Intl.DateTimeFormat('en', {
            timeZone: timezone,
            timeZoneName: 'shortOffset'
          });
          const parts = formatter.formatToParts(date);
          const offsetPart = parts.find(part => part.type === 'timeZoneName');
          return offsetPart ? offsetPart.value : '';
        } catch (e) {
          return '';
        }
      }

      // 格式化日期时间（考虑时区）
      function formatDateTimeInTimezone(date, timezone) {
        if (timezone === 'local') {
          return formatDateTime(date);
        }

        try {
          const formatter = new Intl.DateTimeFormat('en', {
            timeZone: timezone,
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
          });
          
          const parts = formatter.formatToParts(date);
          const year = parts.find(p => p.type === 'year').value;
          const month = parts.find(p => p.type === 'month').value;
          const day = parts.find(p => p.type === 'day').value;
          const hour = parts.find(p => p.type === 'hour').value;
          const minute = parts.find(p => p.type === 'minute').value;
          const second = parts.find(p => p.type === 'second').value;
          
          return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
        } catch (e) {
          return formatDateTime(date);
        }
      }

      // 初始化
      document.addEventListener('DOMContentLoaded', () => {
        // 设置默认日期为今天
        const today = new Date();
        document.getElementById('dateInput').value = today.toISOString().split('T')[0];
        document.getElementById('hourInput').value = today.getHours();
        document.getElementById('minuteInput').value = today.getMinutes();
        document.getElementById('secondInput').value = today.getSeconds();

        // 绑定事件
        document.getElementById('timestampInput').addEventListener('input', convertTimestampToDatetime);
        document.getElementById('timezoneSelect').addEventListener('change', convertTimestampToDatetime);
        document.getElementById('dateInput').addEventListener('change', convertDatetimeToTimestamp);
        document.getElementById('hourInput').addEventListener('input', convertDatetimeToTimestamp);
        document.getElementById('minuteInput').addEventListener('input', convertDatetimeToTimestamp);
        document.getElementById('secondInput').addEventListener('input', convertDatetimeToTimestamp);
        document.getElementById('datetimeTimezoneSelect').addEventListener('change', convertDatetimeToTimestamp);

        // 单位切换按钮
        document.querySelectorAll('[data-unit]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('[data-unit]').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentUnit = e.target.getAttribute('data-unit');
            convertTimestampToDatetime();
          });
        });

        document.querySelectorAll('[data-output-unit]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('[data-output-unit]').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentOutputUnit = e.target.getAttribute('data-output-unit');
            convertDatetimeToTimestamp();
          });
        });

        // 更新当前时间
        updateCurrentTime();
        setInterval(updateCurrentTime, 1000);

        // 初始转换
        convertDatetimeToTimestamp();
      });

      // Unix 时间戳转日期时间
      function convertTimestampToDatetime() {
        const input = document.getElementById('timestampInput').value.trim();
        const resultBox = document.getElementById('timestampResult');
        const timezone = document.getElementById('timezoneSelect').value;

        if (!input) {
          resultBox.textContent = '请输入时间戳...';
          resultBox.classList.add('empty');
          return;
        }

        const timestamp = parseFloat(input);
        if (isNaN(timestamp)) {
          resultBox.textContent = '无效的时间戳格式';
          resultBox.classList.remove('empty');
          return;
        }

        let date;
        if (currentUnit === 'milliseconds') {
          date = new Date(timestamp);
        } else {
          date = new Date(timestamp * 1000);
        }

        if (isNaN(date.getTime())) {
          resultBox.textContent = '无效的时间戳值';
          resultBox.classList.remove('empty');
          return;
        }

        // Unix 时间戳是 UTC 时间，需要转换为指定时区显示
        const formatted = formatDateTimeInTimezone(date, timezone);
        const offset = getTimezoneOffset(date, timezone);
        const timezoneName = timezone === 'local' ? '本地时区' : timezone;
        resultBox.textContent = `${formatted} (${timezoneName} ${offset})`;
        resultBox.classList.remove('empty');
      }

      // 日期时间转 Unix 时间戳
      function convertDatetimeToTimestamp() {
        const dateInput = document.getElementById('dateInput').value;
        const hour = parseInt(document.getElementById('hourInput').value) || 0;
        const minute = parseInt(document.getElementById('minuteInput').value) || 0;
        const second = parseInt(document.getElementById('secondInput').value) || 0;
        const timezone = document.getElementById('datetimeTimezoneSelect').value;

        const resultBox = document.getElementById('datetimeResult');

        if (!dateInput) {
          resultBox.textContent = '请选择日期时间...';
          resultBox.classList.add('empty');
          return;
        }

        let date;
        if (timezone === 'local') {
          // 本地时区：直接使用本地时间
          date = new Date(dateInput);
          date.setHours(hour, minute, second, 0);
        } else {
          // 指定时区：将输入时间视为该时区的本地时间，转换为 UTC 时间戳
          // 使用更简单的方法：构造一个 UTC 日期，然后使用时区偏移来调整
          const dateTimeStr = `${dateInput}T${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}:${String(second).padStart(2, '0')}`;
          
          try {
            // 先创建一个 UTC 日期作为参考点
            const utcRef = new Date(dateTimeStr + 'Z');
            
            // 获取该时区在该时刻相对于 UTC 的偏移量
            // 方法：比较该时区显示的时间和 UTC 时间的差异
            const utcStr = utcRef.toLocaleString('en-US', { timeZone: 'UTC', hour12: false });
            const tzStr = utcRef.toLocaleString('en-US', { timeZone: timezone, hour12: false });
            
            // 解析时间字符串来计算偏移（这个方法比较复杂）
            // 更简单的方法：使用固定偏移量表，然后通过实际测试来验证
            const offsetMinutes = getTimezoneOffsetMinutes(utcRef, timezone);
            
            // 将输入时间视为该时区的本地时间
            // 如果时区是 UTC+8，输入 12:00，那么 UTC 时间是 04:00
            // 所以需要减去 8 小时（480 分钟）
            date = new Date(utcRef.getTime() - offsetMinutes * 60000);
          } catch (e) {
            // 回退到本地时区处理
            date = new Date(dateInput);
            date.setHours(hour, minute, second, 0);
          }
        }

        let timestamp;
        if (currentOutputUnit === 'milliseconds') {
          timestamp = date.getTime();
        } else {
          timestamp = Math.floor(date.getTime() / 1000);
        }

        resultBox.textContent = timestamp.toString();
        resultBox.classList.remove('empty');
      }

      // 获取指定时区在特定日期的 UTC 偏移量（分钟）
      function getTimezoneOffsetMinutes(date, timezone) {
        try {
          // 使用 Intl API 获取时区偏移
          const utcDate = new Date(date.getTime() + (date.getTimezoneOffset() * 60000));
          const tzDate = new Date(utcDate.toLocaleString('en-US', { timeZone: timezone }));
          const localDate = new Date(utcDate.toLocaleString('en-US', { timeZone: 'UTC' }));
          
          // 计算偏移量：时区时间 - UTC 时间
          const offsetMs = tzDate.getTime() - localDate.getTime();
          return offsetMs / 60000;
        } catch (e) {
          // 使用固定偏移量表（不考虑夏令时）
          const fixedOffsets = {
            'UTC': 0,
            'Asia/Shanghai': 480, // UTC+8
            'Asia/Tokyo': 540, // UTC+9
            'Europe/London': 0, // UTC+0
            'America/New_York': -300, // UTC-5
            'America/Los_Angeles': -480 // UTC-8
          };
          return fixedOffsets[timezone] || 0;
        }
      }

      // 格式化日期时间
      function formatDateTime(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');

        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
      }

      // 更新当前时间
      function updateCurrentTime() {
        const now = new Date();
        const currentTimeBox = document.getElementById('currentTime');
        const currentTimestampBox = document.getElementById('currentTimestamp');
        const currentTimezoneBox = document.getElementById('currentTimezone');

        const localTime = formatDateTime(now);
        const utcTime = formatDateTimeInTimezone(now, 'UTC');
        const localOffset = getTimezoneOffset(now, 'local');
        const utcOffset = getTimezoneOffset(now, 'UTC');
        
        currentTimeBox.textContent = `本地时间: ${localTime} (${localOffset})`;
        currentTimestampBox.textContent = `Unix 时间戳 (秒): ${Math.floor(now.getTime() / 1000)} | Unix 时间戳 (毫秒): ${now.getTime()}`;
        currentTimezoneBox.textContent = `UTC 时间: ${utcTime} (UTC${utcOffset})`;
      }

      // 复制结果
      function copyResult(elementId) {
        const element = document.getElementById(elementId);
        const text = element.textContent;

        if (text.includes('请输入') || text.includes('请选择') || text.includes('无效')) {
          return;
        }

        navigator.clipboard.writeText(text).then(() => {
          const btn = event.target;
          const originalText = btn.textContent;
          btn.textContent = '已复制!';
          btn.style.color = '#0F7B0F';
          setTimeout(() => {
            btn.textContent = originalText;
            btn.style.color = '#666';
          }, 1000);
        }).catch(err => {
          console.error('复制失败:', err);
        });
      }
    </script>
  </body>
</html>
