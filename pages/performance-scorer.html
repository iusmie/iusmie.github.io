<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>团队绩效打分工具 | Bits of Life</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../apps/shared/styles/navigation.css">
  <style>
    :root {
      --primary: #667eea;
      --primary-dark: #5a67d8;
      --success: #48bb78;
      --warning: #ed8936;
      --danger: #e53e3e;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .page-header {
      background: linear-gradient(135deg, var(--primary) 0%, #764ba2 100%);
      color: white;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .page-header h1 { margin: 0 0 0.5rem 0; font-size: 1.5rem; }
    .page-header p { margin: 0; opacity: 0.9; font-size: 0.9rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem 2rem; }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .card-title { font-size: 1.1rem; font-weight: 600; margin: 0 0 1rem 0; color: #1a1a1a; }
    .form-group { display: flex; flex-direction: column; gap: 0.2rem; }
    .form-group label { font-size: 0.72rem; color: #64748b; font-weight: 500; }
    .form-group input, .form-group select {
      padding: 0.4rem 0.5rem;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
    }
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger { background: #fee2e2; color: var(--danger); }
    .btn-danger:hover { background: #fecaca; }
    .btn-sm { padding: 0.3rem 0.5rem; font-size: 0.78rem; }
    .btn-icon { padding: 0.3rem 0.5rem; font-size: 0.85rem; }
    .btn-ghost { background: transparent; color: #64748b; }
    .btn-ghost:hover { background: #f1f5f9; }

    .member-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }
    .member-header {
      display: flex;
      align-items: flex-end;
      gap: 0.75rem;
      padding: 0.6rem 1rem;
      background: #f8fafc;
      flex-wrap: wrap;
    }
    .member-header .name-input { flex: 1; min-width: 100px; }
    .member-header .form-group:not(.name-input) { margin: 0; }
    .member-header .form-group:not(.name-input) label { font-size: 0.68rem; }
    .member-header .form-group:not(.name-input) input,
    .member-header .form-group:not(.name-input) select {
      width: 48px;
      padding: 0.35rem 0.3rem;
      text-align: center;
    }
    .member-header .form-group.col-c select { width: 56px; }
    .member-header .name-input input { font-weight: 500; }

    .layer-section {
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      padding: 0.5rem 1rem;
      gap: 0.75rem;
      background: #fafafa;
    }
    .layer-section:hover { background: #f1f5f9; }
    .layer-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 500;
      font-size: 0.88rem;
    }
    .layer-header .calc-value {
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 600;
    }
    .layer-subgrid {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.6rem;
      flex: 1;
      overflow-x: auto;
      padding: 0.4rem 0.75rem;
      background: rgba(72, 187, 120, 0.08);
      border: 1px solid rgba(72, 187, 120, 0.3);
      border-radius: 6px;
    }
    .layer-subgrid .form-group {
      flex: 1;
      min-width: 64px;
    }
    .layer-subgrid .form-group input {
      padding: 0.3rem 0.4rem;
      font-size: 0.9rem;
      text-align: center;
    }
    .layer-subgrid .form-group label { font-size: 0.7rem; }
    .layer-subgrid .form-group label .w { color: #94a3b8; font-weight: 400; }

    .results-table { width: 100%; border-collapse: collapse; }
    .results-table th, .results-table td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    .results-table th {
      background: #f8fafc;
      font-weight: 600;
      color: #475569;
      font-size: 0.85rem;
    }
    .results-table tr:hover { background: #fafafa; }
    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .rank-1 { background: linear-gradient(135deg, #ffd700, #ffb347); color: #5c3d00; }
    .rank-2 { background: linear-gradient(135deg, #c0c0c0, #a8a8a8); color: #333; }
    .rank-3 { background: linear-gradient(135deg, #cd7f32, #b87333); color: white; }
    .rank-other { background: #e2e8f0; color: #475569; }
    .grade-badge { padding: 0.25rem 0.5rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
    .grade-S { background: #d1fae5; color: #065f46; }
    .grade-A { background: #dbeafe; color: #1e40af; }
    .grade-B { background: #fef3c7; color: #92400e; }
    .grade-C { background: #fed7aa; color: #9a3412; }
    .grade-D { background: #fecaca; color: #991b1b; }
    .outstanding-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .outstanding-tag {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      background: #e0e7ff;
      color: var(--primary-dark);
      border-radius: 4px;
    }
    .formula-hint {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 1rem;
      padding: 0.75rem;
      background: #f8fafc;
      border-radius: 8px;
    }

    .batch-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .batch-actions .btn { flex-shrink: 0; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: 0.2s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-box {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      max-width: 520px;
      width: 90%;
      max-height: 80vh;
      overflow: auto;
    }
    .modal-box h3 { margin: 0 0 1rem 0; font-size: 1.1rem; }
    .modal-box textarea {
      width: 100%;
      min-height: 120px;
      padding: 0.75rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      resize: vertical;
    }
    .modal-box .hint { font-size: 0.8rem; color: #64748b; margin-top: 0.5rem; }
    .modal-box .modal-actions { display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: flex-end; }
  </style>
</head>
<body>
  <div id="navigationContainer"></div>

  <div class="page-header">
    <div class="container">
      <h1>📊 团队绩效打分工具</h1>
      <p>基于 L1~L5 五层模型及细分维度，快速为团队成员打分、排序，并识别各维度优异项</p>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2 class="card-title">成员评分</h2>
      <div class="batch-actions">
        <button type="button" class="btn btn-primary" id="addMemberBtn">+ 添加成员</button>
        <button type="button" class="btn btn-ghost" id="batchAddBtn">批量添加成员</button>
        <button type="button" class="btn btn-ghost" id="batchImportBtn">批量导入</button>
      </div>
      <div id="memberCards"></div>
      <div class="formula-hint">
        <strong>公式：</strong>L5=(代码质量×40%+交付效率×30%+系统稳定×20%+技术习惯×10%)×C；L4/L3/L2/L1 由各自子项加权。最终绩效分 = (L5×C×50% + L4×20% + L3×15% + L2×10% + L1×5%) × 10 + 加分 - 扣分，范围 0~120
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">排名与优异项</h2>
      <div id="resultsContainer">
        <p style="color:#999; text-align:center; padding:2rem;">添加成员并填写分数后，点击下方按钮计算</p>
      </div>
      <button type="button" class="btn btn-primary" id="calcBtn" style="margin-top:1rem;">计算排名</button>
    </div>
  </div>

  <div class="modal-overlay" id="batchModal">
    <div class="modal-box">
      <h3 id="batchModalTitle">批量操作</h3>
      <textarea id="batchModalInput" placeholder=""></textarea>
      <p class="hint" id="batchModalHint"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="batchModalCancel">取消</button>
        <button type="button" class="btn btn-primary" id="batchModalConfirm">确认</button>
      </div>
    </div>
  </div>

  <script src="../apps/shared/components/Navigation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const nav = new Navigation('navigationContainer', {
        logoImage: '/assets/images/BVme2Rxom8sQayOOVDbdWY.webp',
        homePath: '../index.html'
      });
      nav.render();
    });

    const LAYERS = {
      l5: {
        label: 'L5 硬性产出',
        weight: 0.5,
        sub: [
          { key: 'l5_quality', label: '代码质量', w: 0.4 },
          { key: 'l5_efficiency', label: '交付效率', w: 0.3 },
          { key: 'l5_stable', label: '系统稳定', w: 0.2 },
          { key: 'l5_habit', label: '技术习惯', w: 0.1 }
        ]
      },
      l4: {
        label: 'L4 压力应对',
        weight: 0.2,
        sub: [
          { key: 'l4_response', label: '故障响应', w: 0.5 },
          { key: 'l4_comm', label: '沟通专业', w: 0.3 },
          { key: 'l4_feedback', label: '协作反馈', w: 0.2 }
        ]
      },
      l3: {
        label: 'L3 协作有效',
        weight: 0.15,
        sub: [
          { key: 'l3_contrib', label: '协作贡献', w: 0.4 },
          { key: 'l3_knowledge', label: '知识沉淀', w: 0.4 },
          { key: 'l3_fusion', label: '团队融合', w: 0.2 }
        ]
      },
      l2: {
        label: 'L2 方案质量',
        weight: 0.1,
        sub: [
          { key: 'l2_depth', label: '方案深度', w: 0.5 },
          { key: 'l2_review', label: '复盘质量', w: 0.3 },
          { key: 'l2_innov', label: '技术创新', w: 0.2 }
        ]
      },
      l1: {
        label: 'L1 成长自驱',
        weight: 0.05,
        sub: [
          { key: 'l1_drive', label: '自驱行为', w: 0.6 },
          { key: 'l1_value', label: '价值观匹配', w: 0.4 }
        ]
      }
    };

    const defaultMember = () => ({
      name: '',
      c: 1,
      bonus: 0,
      deduct: 0,
      l5_quality: 8, l5_efficiency: 8, l5_stable: 8, l5_habit: 8,
      l4_response: 8, l4_comm: 8, l4_feedback: 8,
      l3_contrib: 7, l3_knowledge: 7, l3_fusion: 7,
      l2_depth: 7, l2_review: 7, l2_innov: 7,
      l1_drive: 8, l1_value: 8
    });

    let members = [defaultMember()];

    function calcL5(m) {
      const raw = m.l5_quality * 0.4 + m.l5_efficiency * 0.3 + m.l5_stable * 0.2 + m.l5_habit * 0.1;
      return raw * (m.c || 1);
    }
    function calcL4(m) {
      return (m.l4_response || 0) * 0.5 + (m.l4_comm || 0) * 0.3 + (m.l4_feedback || 0) * 0.2;
    }
    function calcL3(m) {
      return (m.l3_contrib || 0) * 0.4 + (m.l3_knowledge || 0) * 0.4 + (m.l3_fusion || 0) * 0.2;
    }
    function calcL2(m) {
      return (m.l2_depth || 0) * 0.5 + (m.l2_review || 0) * 0.3 + (m.l2_innov || 0) * 0.2;
    }
    function calcL1(m) {
      return (m.l1_drive || 0) * 0.6 + (m.l1_value || 0) * 0.4;
    }

    function calcLayerValue(layerKey, m) {
      if (layerKey === 'l5') return calcL5(m);
      if (layerKey === 'l4') return calcL4(m);
      if (layerKey === 'l3') return calcL3(m);
      if (layerKey === 'l2') return calcL2(m);
      return calcL1(m);
    }

    function calcScore(m) {
      const l5 = calcL5(m), l4 = calcL4(m), l3 = calcL3(m), l2 = calcL2(m), l1 = calcL1(m);
      const base = l5 * 0.5 + l4 * 0.2 + l3 * 0.15 + l2 * 0.1 + l1 * 0.05;
      return Math.max(0, Math.min(120, base * 10 + (m.bonus || 0) - (m.deduct || 0)));
    }

    function getGrade(score) {
      if (score >= 105) return 'S';
      if (score >= 90) return 'A';
      if (score >= 75) return 'B';
      if (score >= 60) return 'C';
      return 'D';
    }

    function renderMemberCard(m, idx) {
      const layerHTML = Object.entries(LAYERS).map(([key, cfg]) => {
        const val = calcLayerValue(key, m);
        const subHTML = cfg.sub.map(s => `
          <div class="form-group">
            <label>${s.label} <span class="w">(${Math.round(s.w*100)}%)</span></label>
            <input type="number" data-field="${s.key}" min="1" max="10" step="0.1" value="${m[s.key] ?? 8}">
          </div>
        `).join('');
        return `
          <div class="layer-section" data-layer="${key}">
            <div class="layer-header">
              <span>${cfg.label}</span>
              <span class="calc-value">= ${val.toFixed(2)}</span>
            </div>
            <div class="layer-subgrid">${subHTML}</div>
          </div>
        `;
      }).join('');

      return `
        <div class="member-card" data-idx="${idx}">
          <div class="member-header">
            <div class="form-group name-input">
              <label>姓名</label>
              <input type="text" data-field="name" value="${m.name}" placeholder="成员${idx+1}">
            </div>
            <div class="form-group col-c" style="width:56px;">
              <label>复杂度 C</label>
              <select data-field="c">
                <option value="0.9" ${m.c==0.9?'selected':''}>0.9</option>
                <option value="1" ${m.c==1?'selected':''}>1.0</option>
                <option value="1.1" ${m.c==1.1?'selected':''}>1.1</option>
              </select>
            </div>
            <div class="form-group" style="width:52px;">
              <label>加分</label>
              <input type="number" data-field="bonus" min="0" max="20" value="${m.bonus||0}">
            </div>
            <div class="form-group" style="width:52px;">
              <label>扣分</label>
              <input type="number" data-field="deduct" min="0" value="${m.deduct||0}">
            </div>
            <button type="button" class="btn btn-ghost btn-sm copy-btn" title="复制上一人分数" ${idx===0?'disabled':''}>复制</button>
            <button type="button" class="btn btn-danger btn-sm remove-btn" ${members.length<=1?'disabled':''}>删除</button>
          </div>
          ${layerHTML}
        </div>
      `;
    }

    function renderMemberCards() {
      const container = document.getElementById('memberCards');
      container.innerHTML = members.map((m, i) => renderMemberCard(m, i)).join('');

      container.querySelectorAll('input, select').forEach(el => {
        el.addEventListener('change', () => { syncFromDOM(); updateCalcValues(); });
        el.addEventListener('input', () => { syncFromDOM(); updateCalcValues(); });
      });

      container.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const card = e.target.closest('.member-card');
          const idx = parseInt(card.dataset.idx);
          members.splice(idx, 1);
          renderMemberCards();
        });
      });

      container.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          syncFromDOM();
          const card = e.target.closest('.member-card');
          const idx = parseInt(card.dataset.idx);
          if (idx > 0) {
            const prev = members[idx - 1];
            const curr = members[idx];
            Object.keys(defaultMember()).filter(k => k !== 'name').forEach(k => { curr[k] = prev[k]; });
            renderMemberCards();
          }
        });
      });

      updateCalcValues();
    }

    function syncFromDOM() {
      document.querySelectorAll('.member-card').forEach((card, i) => {
        const m = members[i];
        if (!m) return;
        card.querySelectorAll('[data-field]').forEach(el => {
          const f = el.dataset.field;
          const v = el.type === 'number' ? parseFloat(el.value) || 0 : el.value;
          m[f] = f === 'c' ? parseFloat(el.value) : v;
        });
      });
    }

    function updateCalcValues() {
      syncFromDOM();
      document.querySelectorAll('.member-card').forEach((card, i) => {
        const m = members[i];
        if (!m) return;
        Object.keys(LAYERS).forEach(key => {
          const section = card.querySelector(`.layer-section[data-layer="${key}"]`);
          const valEl = section?.querySelector('.calc-value');
          if (valEl) valEl.textContent = '= ' + calcLayerValue(key, m).toFixed(2);
        });
      });
    }

    function calc() {
      syncFromDOM();
      const valid = members.filter(m => m.name && String(m.name).trim());
      if (valid.length === 0) {
        document.getElementById('resultsContainer').innerHTML =
          '<p style="color:#e53e3e; text-align:center; padding:1rem;">请至少填写一名成员的姓名</p>';
        return;
      }

      const allSubKeys = [];
      Object.values(LAYERS).forEach(cfg => cfg.sub.forEach(s => allSubKeys.push({ key: s.key, label: s.label, layerLabel: cfg.label })));

      const results = valid.map(m => ({
        ...m,
        l5: calcL5(m), l4: calcL4(m), l3: calcL3(m), l2: calcL2(m), l1: calcL1(m),
        score: calcScore(m),
        grade: getGrade(calcScore(m))
      }));

      results.sort((a, b) => b.score - a.score);

      const avgs = {};
      allSubKeys.forEach(({ key }) => {
        avgs[key] = results.reduce((s, r) => s + (r[key] || 0), 0) / results.length;
      });

      results.forEach(r => {
        r.outstanding = allSubKeys
          .filter(({ key }) => (r[key] || 0) > avgs[key])
          .map(({ label }) => label);
      });

      const tableHTML = `
        <table class="results-table">
          <thead>
            <tr>
              <th>排名</th>
              <th>姓名</th>
              <th>最终绩效分</th>
              <th>评级</th>
              <th>优异项（细分维度高于团队平均）</th>
            </tr>
          </thead>
          <tbody>
            ${results.map((r, i) => `
              <tr>
                <td><span class="rank-badge rank-${i < 3 ? i + 1 : 'other'}">${i + 1}</span></td>
                <td><strong>${r.name || '未命名'}</strong></td>
                <td>${r.score.toFixed(2)}</td>
                <td><span class="grade-badge grade-${r.grade}">${r.grade}</span></td>
                <td>
                  ${r.outstanding.length ? `
                    <div class="outstanding-tags">
                      ${r.outstanding.map(l => `<span class="outstanding-tag">${l}</span>`).join('')}
                    </div>
                  ` : '<span style="color:#94a3b8;">—</span>'}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      document.getElementById('resultsContainer').innerHTML = tableHTML;
    }

    document.getElementById('addMemberBtn').addEventListener('click', () => {
      members.push(defaultMember());
      renderMemberCards();
    });

    document.getElementById('calcBtn').addEventListener('click', calc);

    // 批量操作
    const IMPORT_COL_KEYS = ['name','c','l5_quality','l5_efficiency','l5_stable','l5_habit','l4_response','l4_comm','l4_feedback','l3_contrib','l3_knowledge','l3_fusion','l2_depth','l2_review','l2_innov','l1_drive','l1_value','bonus','deduct'];

    function openBatchModal(mode) {
      const modal = document.getElementById('batchModal');
      const title = document.getElementById('batchModalTitle');
      const input = document.getElementById('batchModalInput');
      const hint = document.getElementById('batchModalHint');
      if (mode === 'add') {
        title.textContent = '批量添加成员';
        input.placeholder = '每行一个姓名\n例如：\n张三\n李四\n王五';
        hint.textContent = '每行输入一个成员姓名，将批量创建成员卡片（使用默认分数）';
        input.value = '';
      } else {
        title.textContent = '批量导入';
        input.placeholder = '从 Excel 复制粘贴，Tab 或逗号分隔\n列顺序：姓名, C, 代码质量, 交付效率, 系统稳定, 技术习惯, 故障响应, 沟通专业, 协作反馈, 协作贡献, 知识沉淀, 团队融合, 方案深度, 复盘质量, 技术创新, 自驱行为, 价值观匹配, 加分, 扣分';
        hint.textContent = '支持 1 列（仅姓名）或 19 列（完整数据）。C 填 0.9/1/1.1';
        input.value = '';
      }
      modal.classList.add('active');
      input.focus();
    }

    function closeBatchModal() {
      document.getElementById('batchModal').classList.remove('active');
    }

    function parseBatchAdd(text) {
      return text.split(/\n/).map(s => s.trim()).filter(Boolean);
    }

    function parseBatchImport(text) {
      const lines = text.split(/\n/).map(s => s.trim()).filter(Boolean);
      const sep = text.includes('\t') ? '\t' : ',';
      const result = [];
      for (const line of lines) {
        const cells = line.split(sep).map(c => c.trim());
        if (cells.length === 1) {
          result.push({ ...defaultMember(), name: cells[0] });
        } else if (cells.length >= 19) {
          const m = defaultMember();
          IMPORT_COL_KEYS.forEach((k, i) => {
            const v = cells[i];
            if (k === 'name') m.name = v || '';
            else if (k === 'c') m.c = parseFloat(v) || 1;
            else if (['bonus','deduct'].includes(k)) m[k] = parseFloat(v) || 0;
            else m[k] = parseFloat(v) || 8;
          });
          result.push(m);
        } else {
          result.push({ ...defaultMember(), name: cells[0] || '' });
        }
      }
      return result;
    }

    document.getElementById('batchAddBtn').addEventListener('click', () => openBatchModal('add'));
    document.getElementById('batchImportBtn').addEventListener('click', () => openBatchModal('import'));

    document.getElementById('batchModalCancel').addEventListener('click', closeBatchModal);
    document.getElementById('batchModal').addEventListener('click', (e) => {
      if (e.target.id === 'batchModal') closeBatchModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('batchModal').classList.contains('active')) closeBatchModal();
    });

    document.getElementById('batchModalConfirm').addEventListener('click', () => {
      const input = document.getElementById('batchModalInput').value.trim();
      const title = document.getElementById('batchModalTitle').textContent;
      if (!input) { closeBatchModal(); return; }
      if (title.includes('批量添加')) {
        const names = parseBatchAdd(input);
        names.forEach(n => members.push({ ...defaultMember(), name: n }));
      } else {
        const imported = parseBatchImport(input);
        members = imported.length ? imported : members;
      }
      closeBatchModal();
      renderMemberCards();
    });

    renderMemberCards();
  </script>
</body>
</html>
