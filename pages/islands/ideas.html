<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Creative Ideas - Ideas and creative projects" />
    <title>Creative Ideas - Lijuan Cao</title>
    <link rel="stylesheet" href="../../assets/static/css/common.css" />
  </head>
  <body>
    <div class="container">
      <a href="../../index.html" class="back-home" data-i18n="back_home">← Back to Home</a>

      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="zh">中文</button>
      </div>

      <header class="island-header">
        <h1 class="island-title" data-i18n="ideas_island">💡 Creative Ideas</h1>
        <p class="island-description" data-i18n="ideas_island_desc">Ideas and creative projects</p>
      </header>

      <main class="island-content">
        <section class="section">
          <h2 class="section-title" data-i18n="ideas">💡 Ideas</h2>
          <div class="tool-category">
            <span class="tool-links">
              <a href="#" class="ideas-trigger tool-category-name" data-i18n="ideas">💡 Ideas</a>
              <div class="ideas-stats-bar" id="ideasStatsBar"></div>
            </span>
          </div>
        </section>
      </main>
    </div>

    <!-- Ideas 弹层 -->
    <div id="ideasModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 data-i18n="ideas">💡 Ideas</h2>
          <div class="modal-actions">
            <button class="btn-close" id="closeModalBtn">×</button>
          </div>
        </div>
        <div class="modal-tabs">
          <div class="modal-tabs-left">
            <button class="tab-btn active" data-tab="thinking" data-i18n="thinking">Thinking</button>
            <button class="tab-btn" data-tab="completed" data-i18n="completed">Completed</button>
            <button class="tab-btn" data-tab="abandoned" data-i18n="abandoned">Abandoned</button>
          </div>
          <div class="modal-tabs-right">
            <button class="btn-add" id="addIdeaBtn" data-i18n="add">+ 新增</button>
          </div>
        </div>
        <div class="modal-body">
          <div class="tab-content active" id="thinkingTab">
            <div class="ideas-list" id="thinkingList"></div>
          </div>
          <div class="tab-content" id="completedTab">
            <div class="ideas-list" id="completedList"></div>
          </div>
          <div class="tab-content" id="abandonedTab">
            <div class="ideas-list" id="abandonedList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 新增/编辑想法表单 -->
    <div id="ideaFormModal" class="modal">
      <div class="modal-content modal-form">
        <div class="modal-header">
          <h2 id="formTitle" data-i18n="add_idea">新增想法</h2>
          <button class="btn-close" id="closeFormBtn">×</button>
        </div>
        <div class="modal-body">
          <form id="ideaForm">
            <div class="form-group">
              <label data-i18n="idea_name">想法名称</label>
              <input type="text" id="ideaName" required />
            </div>
            <div class="form-group">
              <label data-i18n="idea_date">时间</label>
              <input type="date" id="ideaDate" required />
            </div>
            <div class="form-group">
              <label data-i18n="idea_status">状态</label>
              <select id="ideaStatus" required>
                <option value="thinking" data-i18n="thinking">Thinking</option>
                <option value="completed" data-i18n="completed">Completed</option>
                <option value="abandoned" data-i18n="abandoned">Abandoned</option>
              </select>
            </div>
            <div class="form-group">
              <label data-i18n="idea_description">想法说明</label>
              <textarea id="ideaDescription" rows="4" required></textarea>
            </div>
            <div class="form-actions">
              <button type="button" class="btn-cancel" id="cancelFormBtn" data-i18n="cancel">取消</button>
              <button type="submit" class="btn-submit" data-i18n="save">保存</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="../../assets/static/js/i18n.js"></script>
    <script src="../../assets/static/js/ideas.js"></script>
  </body>
</html>
