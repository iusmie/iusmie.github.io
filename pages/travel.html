<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="旅途印记 - 签证攻略与旅行路线指南" />
    <title>旅途印记 | Travel Island</title>
    <link rel="stylesheet" href="../apps/shared/styles/navigation.css" />
    <link rel="stylesheet" href="../apps/travel/styles/travel.css" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <!-- 导航 -->
    <div id="navigationContainer"></div>

    <div class="travel-page">
      <div class="travel-container">
        <!-- 标签页导航 -->
        <div class="travel-tabs">
          <button class="travel-tab active" data-tab="visa">
            <span class="tab-icon">🛂</span>
            <span class="tab-text">签证指南</span>
            <span class="tab-badge" id="visaTabCount">6</span>
          </button>
          <button class="travel-tab" data-tab="guide">
            <span class="tab-icon">🗺️</span>
            <span class="tab-text">旅行攻略</span>
            <span class="tab-count" id="guideTabCount">4</span>
          </button>
        </div>

        <!-- 签证内容 -->
        <div class="travel-tab-content active" id="visaContent">
          <div id="visaContainer"></div>
        </div>

        <!-- 攻略内容 -->
        <div class="travel-tab-content" id="guideContent">
          <div id="guideContainer"></div>
        </div>
      </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 公共导航组件 -->
    <script src="../apps/shared/components/Navigation.js"></script>
    
    <!-- 组件脚本 -->
    <script src="../apps/travel/components/VisaComponent.js"></script>
    <script src="../apps/travel/components/TimelineComponent.js"></script>
    <script src="../apps/travel/components/MapComponent.js"></script>
    <script src="../apps/travel/components/TravelGuideComponent.js"></script>

    <!-- 主应用脚本 -->
    <script src="../apps/travel/TravelApp.js"></script>
    
    <!-- 初始化导航 -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const nav = new Navigation('navigationContainer', {
          logoImage: '/assets/images/BVme2Rxom8sQayOOVDbdWY.webp',
          homePath: '../index.html'
        });
        nav.render();
      });
    </script>
  </body>
</html>
