<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="多时区时钟工具" />
    <title>多时区时钟 | World Clock</title>
    <link rel="stylesheet" href="../../../assets/static/css/common.css" />
    <style>
      .world-clock-container {
        max-width: 800px;
        margin: 0 auto;
      }

      .clocks-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-top: 20px;
      }

      .clock-card {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 20px;
        text-align: center;
        transition: all 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
      }

      .clock-card:hover {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .clock-card-content {
        width: 100%;
      }

      .clock-city {
        font-size: 16px;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
      }

      .clock-timezone {
        font-size: 12px;
        color: #666;
        margin-bottom: 12px;
      }

      .clock-time {
        font-size: 32px;
        font-weight: 600;
        color: #333;
        font-family: 'Courier New', monospace;
        margin-bottom: 8px;
      }

      .clock-date {
        font-size: 14px;
        color: #666;
      }

      .add-clock-section {
        margin-top: 30px;
        padding: 20px;
        background: #f9f9f9;
        border-radius: 4px;
      }

      .add-clock-section h3 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 15px;
        color: #333;
      }

      .btn-remove {
        position: absolute;
        top: 8px;
        right: 8px;
        padding: 4px 8px;
        font-size: 12px;
        color: #999;
        background: transparent;
        border: none;
        cursor: pointer;
        transition: color 0.2s;
      }

      .btn-remove:hover {
        color: #e16259;
      }

      .clock-face-card {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 20px;
        text-align: center;
        position: relative;
      }

      .clock-face-canvas {
        width: 100%;
        height: auto;
        display: block;
      }

      .clock-face-label {
        margin-top: 10px;
        font-size: 14px;
        font-weight: 600;
        color: #333;
      }

      .clock-face-timezone {
        font-size: 12px;
        color: #666;
        margin-top: 4px;
      }

      @media (max-width: 1024px) {
        .clocks-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 768px) {
        .clocks-grid {
          grid-template-columns: 1fr;
        }

        .clock-time {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href../../index.html" class="back-home">← 返回首页</a>

      <div class="header">
        <h1 class="name">🕐 多时区时钟</h1>
        <p class="title">World Clock</p>
        <p class="bio">
          同时查看多个时区的当前时间，方便跨时区沟通和规划。
        </p>
      </div>

      <div class="section">
        <div class="world-clock-container">
          <!-- 合并视图：同时显示列表和表盘 -->
          <div class="clocks-grid" id="clocksGrid">
            <!-- 时钟卡片将通过 JavaScript 动态生成 -->
          </div>

          <div class="add-clock-section">
            <h3>添加时区</h3>
            <div class="input-group">
              <label>选择时区</label>
              <select id="timezoneSelect">
                <option value="">-- 选择时区 --</option>
                <option value="Asia/Shanghai">Asia/Shanghai (UTC+8)</option>
                <option value="Asia/Tokyo">Asia/Tokyo (UTC+9)</option>
                <option value="Asia/Hong_Kong">Asia/Hong_Kong (UTC+8)</option>
                <option value="Asia/Singapore">Asia/Singapore (UTC+8)</option>
                <option value="Asia/Dubai">Asia/Dubai (UTC+4)</option>
                <option value="Europe/London">Europe/London (UTC+0)</option>
                <option value="Europe/Paris">Europe/Paris (UTC+1)</option>
                <option value="Europe/Berlin">Europe/Berlin (UTC+1)</option>
                <option value="America/New_York">America/New_York (UTC-5)</option>
                <option value="America/Chicago">America/Chicago (UTC-6)</option>
                <option value="America/Denver">America/Denver (UTC-7)</option>
                <option value="America/Los_Angeles">America/Los_Angeles (UTC-8)</option>
                <option value="America/Toronto">America/Toronto (UTC-5)</option>
                <option value="America/Vancouver">America/Vancouver (UTC-8)</option>
                <option value="Australia/Sydney">Australia/Sydney (UTC+10)</option>
                <option value="Australia/Melbourne">Australia/Melbourne (UTC+10)</option>
                <option value="Pacific/Auckland">Pacific/Auckland (UTC+12)</option>
                <option value="UTC">UTC</option>
              </select>
            </div>
            <button class="btn-add-clock" onclick="addClock()">添加时钟</button>
          </div>
        </div>
      </div>

      <div class="footer">
        <p>Made with ❤️ | © 2025 Personal Website</p>
      </div>
    </div>

    <script>
      let clocks = [];
      let updateInterval = null;

      // 时区颜色映射（每个时区使用一种颜色，不同时区使用不同颜色）
      const timezoneColors = {
        'local': '#E16259',      // 红色
        'UTC': '#0B85FF',        // 蓝色
        'Asia/Shanghai': '#0F7B0F',      // 绿色
        'Asia/Tokyo': '#9065B0',        // 紫色
        'Asia/Hong_Kong': '#EAB308',    // 黄色
        'Asia/Singapore': '#F97316',    // 橙色
        'Asia/Dubai': '#06B6D4',        // 青色
        'Europe/London': '#8B5CF6',      // 靛蓝色
        'Europe/Paris': '#EC4899',      // 粉色
        'Europe/Berlin': '#10B981',     // 翠绿色
        'America/New_York': '#EF4444',   // 亮红色
        'America/Chicago': '#3B82F6',    // 亮蓝色
        'America/Denver': '#F59E0B',     // 琥珀色
        'America/Los_Angeles': '#14B8A6', // 青绿色
        'America/Toronto': '#A855F7',    // 紫红色
        'America/Vancouver': '#F97316',  // 橙色
        'Australia/Sydney': '#06B6D4',  // 青色
        'Australia/Melbourne': '#8B5CF6', // 靛蓝色
        'Pacific/Auckland': '#EC4899'     // 粉色
      };

      // 获取时区显示名称（从下拉选择框中获取）
      function getTimezoneDisplayName(timezone) {
        if (timezone === 'local') {
          return '本地时间';
        }
        
        const select = document.getElementById('timezoneSelect');
        if (select) {
          const option = select.querySelector(`option[value="${timezone}"]`);
          if (option) {
            return option.textContent; // 返回选项的文本，如 "Asia/Shanghai (UTC+8)"
          }
        }
        
        // 如果找不到选项，返回时区名称本身
        return timezone;
      }

      // 初始化
      document.addEventListener('DOMContentLoaded', () => {
        // 加载保存的时钟
        loadClocks();
        
        // 如果没有时钟，添加默认的本地时区和 UTC
        if (clocks.length === 0) {
          addClock('local');
          addClock('UTC');
        } else {
          renderClocks();
        }
        
        // 初始渲染表盘
        clocks.forEach(timezone => {
          updateClockFace(timezone);
        });

        // 开始更新时间
        startUpdate();
      });

      // 页面可见性变化时继续更新
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          updateAllClocks();
        }
      });

      // 添加时钟
      function addClock(timezone) {
        if (!timezone) {
          const select = document.getElementById('timezoneSelect');
          timezone = select.value;
          if (!timezone) {
            alert('请选择时区');
            return;
          }
        }

        // 检查是否已存在
        if (clocks.includes(timezone)) {
          alert('该时区已添加');
          return;
        }

        clocks.push(timezone);
        saveClocks();
        renderClocks();
        
        // 清空选择
        const select = document.getElementById('timezoneSelect');
        if (select) {
          select.value = '';
        }
      }

      // 移除时钟
      function removeClock(timezone) {
        clocks = clocks.filter(tz => tz !== timezone);
        saveClocks();
        renderClocks();
      }


      // 渲染所有时钟（合并视图）
      function renderClocks() {
        const grid = document.getElementById('clocksGrid');
        if (!grid) {
          console.error('clocksGrid element not found');
          return;
        }
        grid.innerHTML = '';

        clocks.forEach(timezone => {
          const card = createClockCard(timezone);
          grid.appendChild(card);
        });

        updateAllClocks();
      }


      // 创建时钟卡片（包含表盘和列表信息）
      function createClockCard(timezone) {
        const card = document.createElement('div');
        card.className = 'clock-card';
        card.dataset.timezone = timezone;

        const removeBtn = document.createElement('button');
        removeBtn.className = 'btn-remove';
        removeBtn.textContent = '×';
        removeBtn.onclick = () => removeClock(timezone);

        // 创建表盘
        const canvas = document.createElement('canvas');
        canvas.className = 'clock-face-canvas';
        canvas.width = 200;
        canvas.height = 200;
        canvas.dataset.timezone = timezone;
        canvas.style.maxWidth = '200px';
        canvas.style.marginBottom = '15px';

        // 创建信息区域
        const infoDiv = document.createElement('div');
        infoDiv.className = 'clock-card-content';

        const city = document.createElement('div');
        city.className = 'clock-city';
        city.textContent = getTimezoneDisplayName(timezone);

        const time = document.createElement('div');
        time.className = 'clock-time';
        time.textContent = '--:--:--';

        const date = document.createElement('div');
        date.className = 'clock-date';
        date.textContent = '';

        infoDiv.appendChild(city);
        infoDiv.appendChild(time);
        infoDiv.appendChild(date);

        card.appendChild(removeBtn);
        card.appendChild(canvas);
        card.appendChild(infoDiv);

        return card;
      }


      // 更新所有时钟
      function updateAllClocks() {
        clocks.forEach(timezone => {
          updateClock(timezone);
          updateClockFace(timezone);
        });
      }


      // 更新单个表盘
      function updateClockFace(timezone) {
        const canvas = document.querySelector(`.clock-face-canvas[data-timezone="${timezone}"]`);
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        const size = canvas.width;
        const centerX = size / 2;
        const centerY = size / 2;
        const radius = size / 2 - 20;

        // 清空画布
        ctx.clearRect(0, 0, size, size);

        // 绘制外圆
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.fill();

        // 绘制刻度
        for (let i = 0; i < 12; i++) {
          const angle = (i * 30 - 90) * Math.PI / 180;
          const x1 = centerX + (radius - 20) * Math.cos(angle);
          const y1 = centerY + (radius - 20) * Math.sin(angle);
          const x2 = centerX + radius * Math.cos(angle);
          const y2 = centerY + radius * Math.sin(angle);
          
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = '#333';
          ctx.lineWidth = 3;
          ctx.stroke();

          // 绘制数字
          const numX = centerX + (radius - 30) * Math.cos(angle);
          const numY = centerY + (radius - 30) * Math.sin(angle);
          ctx.fillStyle = '#333';
          ctx.font = 'bold 14px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(i === 0 ? '12' : i.toString(), numX, numY);
        }

        // 绘制小刻度（分钟）
        for (let i = 0; i < 60; i++) {
          if (i % 5 !== 0) {
            const angle = (i * 6 - 90) * Math.PI / 180;
            const x1 = centerX + (radius - 10) * Math.cos(angle);
            const y1 = centerY + (radius - 10) * Math.sin(angle);
            const x2 = centerX + radius * Math.cos(angle);
            const y2 = centerY + radius * Math.sin(angle);
            
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }

        // 获取该时区的时间
        const now = new Date();
        let hours, minutes, seconds;

        if (timezone === 'local') {
          hours = now.getHours();
          minutes = now.getMinutes();
          seconds = now.getSeconds();
        } else {
          try {
            const formatter = new Intl.DateTimeFormat('en', {
              timeZone: timezone,
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: false
            });
            
            const parts = formatter.formatToParts(now);
            hours = parseInt(parts.find(p => p.type === 'hour').value);
            minutes = parseInt(parts.find(p => p.type === 'minute').value);
            seconds = parseInt(parts.find(p => p.type === 'second').value);
          } catch (e) {
            hours = 0;
            minutes = 0;
            seconds = 0;
          }
        }

        // 获取颜色（同一时区的所有指针使用相同颜色）
        const color = timezoneColors[timezone] || timezoneColors['local'];

        // 计算指针角度（12点为0度，顺时针）
        const secondAngle = (seconds * 6 - 90) * Math.PI / 180;
        const minuteAngle = (minutes * 6 + seconds * 0.1 - 90) * Math.PI / 180;
        const hourAngle = (hours * 30 + minutes * 0.5 - 90) * Math.PI / 180;

        // 指针长度（适配较小的表盘）
        const hourLength = radius * 0.40;
        const minuteLength = radius * 0.60;
        const secondLength = radius * 0.75;

        // 绘制时针
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(
          centerX + hourLength * Math.cos(hourAngle),
          centerY + hourLength * Math.sin(hourAngle)
        );
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();

        // 绘制分针
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(
          centerX + minuteLength * Math.cos(minuteAngle),
          centerY + minuteLength * Math.sin(minuteAngle)
        );
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.stroke();

        // 绘制秒针
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(
          centerX + secondLength * Math.cos(secondAngle),
          centerY + secondLength * Math.sin(secondAngle)
        );
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.9;
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.globalAlpha = 1.0;

        // 绘制中心圆点
        ctx.beginPath();
        ctx.arc(centerX, centerY, 6, 0, 2 * Math.PI);
        ctx.fillStyle = '#333';
        ctx.fill();
      }

      // 更新单个时钟
      function updateClock(timezone) {
        const card = document.querySelector(`.clock-card[data-timezone="${timezone}"]`);
        if (!card) return;

        const now = new Date();
        let timeStr, dateStr, offsetStr;

        if (timezone === 'local') {
          timeStr = formatTime(now);
          dateStr = formatDate(now);
          offsetStr = getLocalTimezoneOffset();
        } else {
          try {
            const formatter = new Intl.DateTimeFormat('en', {
              timeZone: timezone,
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: false
            });
            
            const dateFormatter = new Intl.DateTimeFormat('en', {
              timeZone: timezone,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit'
            });

            const timeParts = formatter.formatToParts(now);
            const dateParts = dateFormatter.formatToParts(now);
            
            const hour = timeParts.find(p => p.type === 'hour').value;
            const minute = timeParts.find(p => p.type === 'minute').value;
            const second = timeParts.find(p => p.type === 'second').value;
            
            timeStr = `${hour}:${minute}:${second}`;
            
            const year = dateParts.find(p => p.type === 'year').value;
            const month = dateParts.find(p => p.type === 'month').value;
            const day = dateParts.find(p => p.type === 'day').value;
            dateStr = `${year}-${month}-${day}`;

            // 获取时区偏移
            const offsetFormatter = new Intl.DateTimeFormat('en', {
              timeZone: timezone,
              timeZoneName: 'shortOffset'
            });
            const offsetParts = offsetFormatter.formatToParts(now);
            const offsetPart = offsetParts.find(p => p.type === 'timeZoneName');
            offsetStr = offsetPart ? offsetPart.value : timezone;
          } catch (e) {
            timeStr = '--:--:--';
            dateStr = '';
            offsetStr = timezone;
          }
        }

        card.querySelector('.clock-time').textContent = timeStr;
        card.querySelector('.clock-date').textContent = dateStr;
      }

      // 格式化时间
      function formatTime(date) {
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        return `${hours}:${minutes}:${seconds}`;
      }

      // 格式化日期
      function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      // 获取本地时区偏移
      function getLocalTimezoneOffset() {
        const offset = -new Date().getTimezoneOffset();
        const sign = offset >= 0 ? '+' : '-';
        const hours = Math.floor(Math.abs(offset) / 60);
        const minutes = Math.abs(offset) % 60;
        return `UTC${sign}${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
      }

      // 开始更新
      function startUpdate() {
        if (updateInterval) {
          clearInterval(updateInterval);
        }
        updateAllClocks();
        updateInterval = setInterval(() => {
          updateAllClocks();
        }, 1000);
      }

      // 保存时钟配置
      function saveClocks() {
        localStorage.setItem('worldClocks', JSON.stringify(clocks));
      }

      // 加载时钟配置
      function loadClocks() {
        const saved = localStorage.getItem('worldClocks');
        if (saved) {
          try {
            clocks = JSON.parse(saved);
          } catch (e) {
            clocks = [];
          }
        } else {
          clocks = [];
        }
      }
    </script>
  </body>
</html>
