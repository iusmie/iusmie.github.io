<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown 文档查看器</title>
  <link rel="stylesheet" href="../assets/css/common.css">
  <style>
    .markdown-viewer-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }
    .markdown-content {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      line-height: 1.8;
    }
    .markdown-content h1 {
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .markdown-content h2 {
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 0.3rem;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }
    .markdown-content code {
      background: #f5f5f5;
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }
    .markdown-content pre {
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 5px;
      overflow-x: auto;
      border-left: 3px solid #0B85FF;
    }
    .markdown-content pre code {
      background: none;
      padding: 0;
      font-size: 0.9em;
    }
    .markdown-content ul, .markdown-content ol {
      margin: 1rem 0;
      padding-left: 2rem;
    }
    .markdown-content li {
      margin: 0.5rem 0;
    }
    .markdown-content blockquote {
      border-left: 4px solid #0B85FF;
      padding-left: 1rem;
      margin: 1rem 0;
      color: #666;
      font-style: italic;
    }
    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }
    .markdown-content table th,
    .markdown-content table td {
      border: 1px solid #e0e0e0;
      padding: 0.5rem;
      text-align: left;
    }
    .markdown-content table th {
      background: #f5f5f5;
      font-weight: bold;
    }
    .markdown-content img {
      max-width: 100%;
      height: auto;
      border-radius: 5px;
      margin: 1rem 0;
    }
    .markdown-content a {
      color: #0B85FF;
      text-decoration: none;
    }
    .markdown-content a:hover {
      text-decoration: underline;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: #0B85FF;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .loading {
      text-align: center;
      padding: 2rem;
      color: #666;
    }
    .error {
      color: #E16259;
      padding: 1rem;
      background: #ffe0e0;
      border-radius: 5px;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <div class="markdown-viewer-container">
    <a href="../tools/" class="back-link">← 返回工具列表</a>
    <div id="markdown-content" class="markdown-content">
      <div class="loading">正在加载文档...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script>
    // 配置 marked
    if (typeof marked !== 'undefined') {
      marked.setOptions({
        breaks: true,
        gfm: true,
        headerIds: true,
        mangle: false
      });
    }
    
    // Markdown 解析函数（使用 marked.js 或降级方案）
    function parseMarkdown(markdown) {
      if (typeof marked !== 'undefined') {
        return marked.parse(markdown);
      }
      
      // 降级方案：简单解析
      let html = markdown;
      
      // 标题
      html = html.replace(/^###### (.*$)/gim, '<h6>$1</h6>');
      html = html.replace(/^##### (.*$)/gim, '<h5>$1</h5>');
      html = html.replace(/^#### (.*$)/gim, '<h4>$1</h4>');
      html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
      
      // 粗体和斜体
      html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      
      // 代码块
      html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
      
      // 行内代码
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      
      // 链接
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      
      // 图片
      html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" />');
      
      // 无序列表
      html = html.replace(/^\* (.+)$/gim, '<li>$1</li>');
      html = html.replace(/^- (.+)$/gim, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
      
      // 有序列表
      html = html.replace(/^\d+\. (.+)$/gim, '<li>$1</li>');
      
      // 水平线
      html = html.replace(/^---$/gim, '<hr />');
      
      // 段落
      const paragraphs = html.split(/\n\n+/);
      html = paragraphs.map(p => {
        p = p.trim();
        if (!p) return '';
        if (p.startsWith('<')) return p;
        return '<p>' + p + '</p>';
      }).join('\n');
      
      return html;
    }

    // 从URL参数获取文件路径
    function getUrlParameter(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // 加载并显示 Markdown 文件
    async function loadMarkdownFile(filePath) {
      const contentDiv = document.getElementById('markdown-content');
      
      try {
        const response = await fetch(filePath);
        if (!response.ok) {
          throw new Error(`无法加载文件: ${response.status}`);
        }
        
        const markdown = await response.text();
        const html = parseMarkdown(markdown);
        contentDiv.innerHTML = html;
      } catch (error) {
        contentDiv.innerHTML = `<div class="error">错误: ${error.message}</div>`;
      }
    }

    // 页面加载时执行
    window.addEventListener('DOMContentLoaded', () => {
      const filePath = getUrlParameter('file');
      if (filePath) {
        loadMarkdownFile(filePath);
      } else {
        document.getElementById('markdown-content').innerHTML = 
          '<div class="error">请通过 file 参数指定要查看的 Markdown 文件路径<br>例如: ?file=../docs/example.md</div>';
      }
    });
  </script>
</body>
</html>
